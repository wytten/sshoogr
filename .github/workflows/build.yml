name: Build

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sshoogr
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 11 is the build toolchain (found via ~/.m2/toolchains.xml); 21 runs Gradle.
          java-version: |
            11
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5  # v6 moved caching to a proprietary component under Gradle's terms of use

      - name: Build
        run: ./gradlew build
