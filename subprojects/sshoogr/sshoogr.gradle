plugins {
    id 'java-library'
    id 'groovy'
    id 'application'
    id 'codenarc'
    id 'maven-publish'
}

description = 'A Groovy-based DSL for working with remote SSH servers.'

java {
    // Groovy joint compilation (the .java files under src/main/groovy) only honours these,
    // not options.release.
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease as int
    options.compilerArgs << '-Xlint:-options'
}

tasks.withType(GroovyCompile).configureEach {
    options.release = javaRelease as int
    options.compilerArgs << '-Xlint:-options'
}

application {
    mainClass = 'com.aestasit.infrastructure.ssh.launcher.Sshoogr'
}

dependencies {
    api "org.codehaus.groovy:groovy:${groovyVersion}"
    api "org.slf4j:slf4j-api:${slf4jVersion}"
    api "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
    api "ch.qos.logback:logback-classic:${logbackVersion}"
    api "commons-io:commons-io:${commonsIOVersion}"
    api "commons-codec:commons-codec:${commonsCodecVersion}"
    api "com.github.mwiede:jsch:${jschVersion}"
    api "com.lexicalscope.jewelcli:jewelcli:${jewelcliVersion}"
    api "org.fusesource.jansi:jansi:${jansiVersion}"

    // Needed for running groovydoc.
    compileOnly "org.codehaus.groovy:groovy-groovydoc:${groovyVersion}"

    testImplementation("com.aestasit.infrastructure.mock:groovy-sshd-mock:${sshdMockVersion}") {
        exclude group: 'com.jcraft', module: 'jsch' // replaced by com.github.mwiede:jsch
    }
    constraints {
        // groovy-sshd-mock -> sshd-core 0.7.0 pulls mina-core 2.0.4 (CVE-2024-52046 et al.)
        testImplementation('org.apache.mina:mina-core:2.0.29') {
            because 'mina-core < 2.0.29 has critical CVEs'
        }
    }
}

testing {
    suites {
        test {
            useJUnit(junitVersion)
        }

        // Runs against a real SSH server (see the Vagrantfile); not part of 'check'.
        integrationTest(JvmTestSuite) {
            useJUnit(junitVersion)
            sources {
                groovy.srcDirs = ['src/integration-test/groovy']
                resources.srcDirs = ['src/integration-test/resources']
            }
            dependencies {
                implementation project()
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

codenarc {
    configFile = file('src/conf/codenarc/codenarc.groovy')
}

dependencyLocking {
    lockAllConfigurations()
}

// Regenerate gradle.lockfile with: ./gradlew resolveAndLockAll --write-locks
tasks.register('resolveAndLockAll') {
    notCompatibleWithConfigurationCache('Filters configurations at execution time')
    doFirst {
        assert gradle.startParameter.writeDependencyLocks : 'Run with --write-locks'
    }
    doLast {
        configurations.each { if (it.canBeResolved) it.resolve() }
    }
}

tasks.register('groovydocJar', Jar) {
    archiveClassifier = 'javadoc'
    from tasks.named('groovydoc')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('groovydocJar')
            pom {
                name = 'Sshoogr'
                description = project.description
                url = 'https://github.com/sshoogr/sshoogr'
                inceptionYear = '2011'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'aadamovich'
                        name = 'Andrey Adamovich'
                    }
                }
                scm {
                    url = 'https://github.com/sshoogr/sshoogr'
                    connection = 'scm:git:https://github.com/sshoogr/sshoogr.git'
                }
            }
        }
    }
}
